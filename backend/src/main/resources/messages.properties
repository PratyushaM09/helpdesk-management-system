# --------------------------------------------------------------------------
# Central message bundle (task 5, 11-Development-Rules.md).
#
# Bean Validation constraint messages live here, referenced from an
# annotation via a {key} placeholder (see StrongPassword), never as a
# hardcoded literal string on the annotation itself when a message needs
# to be reused, translated later, or reviewed independent of the code.
# ValidationConfig wires Jakarta Bean Validation's interpolator to this
# file via Spring's MessageSource.
#
# Standard constraints (@NotBlank, @Email, @Size, ...) are NOT re-declared
# here — Hibernate Validator's own built-in default bundle already
# supplies sensible English text for those, and is used automatically for
# any key not found in this file. Add an entry here only to override a
# built-in default's wording, or to define a message for a custom
# constraint (which has no built-in default at all).
#
# Every future Request DTO's custom constraints add their own key here
# following the same "{module}.{field-or-concept}.{concern}" naming shape
# used below - never a business-specific key added to a shared file
# without a clear owner.
# --------------------------------------------------------------------------

validation.password.strength=Password must be at least 10 characters long and include at least one uppercase letter, one lowercase letter, one digit, and one symbol.
