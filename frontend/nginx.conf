# Server block for the containerized static frontend (Phase 5, Milestone 1).
# This is a set of separate multi-page HTML files (login.html, dashboard.html,
# ...), not a client-routed single-page app, so no SPA history-mode fallback
# is needed — nginx just serves each file as requested.

server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Baseline hardening headers only — no behavior change for the app itself.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # ES modules under js/ — served as plain static files with a short cache
    # lifetime (this milestone doesn't add cache-busting/versioned filenames).
    location /js/ {
        add_header Cache-Control "no-cache";
    }
}
