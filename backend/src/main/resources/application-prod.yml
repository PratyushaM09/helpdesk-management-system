# Production profile.
#
# Every value below is a required environment variable with NO default —
# this is deliberate (11-Development-Rules.md §17.1 / §17.7): a missing
# production secret must fail application startup loudly and immediately,
# never fall back to a dev-shaped convenience value. Populate these via the
# deployment platform's environment/secret mechanism (see docs/09-Security-Operations.md
# §17 — plain env vars today, a managed secret store later per SDR-015).
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Never update/create/create-drop in a shared environment
      # (11-Development-Rules.md §14.6). Schema changes reach production only
      # through a reviewed migration (Flyway, once introduced — §14.5).
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  cors:
    # No default: production must declare its real origin(s) explicitly.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  openapi:
    server:
      # No default here either — the localhost fallback in application.yml
      # is a dev-only convenience and must never leak into a prod document.
      url: ${API_SERVER_URL}
      description: ${API_SERVER_DESCRIPTION:Production}

springdoc:
  # A public production Swagger UI/OpenAPI document is an information-
  # disclosure and attack-surface-mapping aid to an attacker — disabled
  # outright, not merely left unauthenticated (09-Security-Operations.md
  # §17.6). SwaggerSecurityConfig's permitted paths become moot once the
  # endpoints themselves don't exist to be reached.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.helpdesk: INFO
    # No SQL/parameter logging in production — both a noise and a
    # sensitive-data-exposure concern (09-Security-Operations.md §16.2).
    org.hibernate.SQL: WARN
