# Local development profile.
#
# One-time local setup required before this profile can start:
#   The database connection PASSWORD is intentionally NOT defaulted here —
#   per docs/09-Security-Operations.md §14.3, even a throwaway local dev
#   credential is never committed as a literal. Set it once as an
#   environment variable (shell profile, or your IDE's run configuration):
#
#     DB_PASSWORD=<your local helpdesk_app MySQL password>
#
#   Everything else below (host, port, schema name, username) has a sane
#   local default and does not need to be set.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:helpdesk_dev}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=false
    username: ${DB_USERNAME:helpdesk_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Permitted only in a throwaway local dev sandbox
      # (11-Development-Rules.md §14.6) — Hibernate may create/update tables
      # as entities are added in later milestones. Never used in a shared
      # or production environment (see application-prod.yml: validate).
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # HS512 in dev (ADR-0003, 03-Security.md §3) — RS256 is prod-only, no
    # point managing a keypair locally. The default secret below is a
    # clearly-labeled, non-sensitive throwaway value (SDR-015): a leak of
    # this exact string has no real-world consequence, since it only ever
    # signs tokens against a local dev database. Override with JWT_SECRET
    # if you want a different one; either way it must be at least 64 bytes
    # (HS512's minimum key strength) or JwtService refuses to start.
    algorithm: HS512
    secret: ${JWT_SECRET:dev-only-helpdesk-jwt-signing-secret-never-use-in-production-please-change-this-value}

  # UserSeeder's bootstrap Administrator (Phase 2 Milestone 3). Same
  # throwaway-default reasoning as app.jwt.secret above — safe to commit
  # because it only ever seeds a local dev database.
  admin-bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL:admin@helpdesk.local}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:Dev0nly!AdminBootstrapPassword}

logging:
  level:
    com.helpdesk: DEBUG
    # SQL statements and bound parameter values — invaluable locally,
    # never enabled outside dev (parameter values can carry user data).
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
