# Production profile.
#
# Every value below is a required environment variable with NO default —
# this is deliberate (11-Development-Rules.md §17.1 / §17.7): a missing
# production secret must fail application startup loudly and immediately,
# never fall back to a dev-shaped convenience value. Populate these via the
# deployment platform's environment/secret mechanism (see docs/09-Security-Operations.md
# §17 — plain env vars today, a managed secret store later per SDR-015).
server:
  # Phase 5 Milestone 2 fix: unset anywhere previously, which meant Spring
  # Boot's own default (NONE) applied — X-Forwarded-Proto/Host/Port from a
  # TLS-terminating reverse proxy or load balancer (the standard production
  # topology; this app itself never terminates TLS) were silently ignored,
  # so request.isSecure() always returned false behind one. That silently
  # disabled HSTS (HttpStrictTransportSecurityHeaderWriter in SecurityConfig
  # only ever writes the header when isSecure() is true) even though the
  # filter chain is otherwise fully configured to emit it. Only set in this
  # profile, not the base application.yml: trusting these headers is only
  # correct when the proxy in front of the app is trusted to strip/set them
  # itself (any reverse proxy worth using does) — a bare local/dev/docker
  # instance with no proxy in front has no such guarantee.
  forward-headers-strategy: framework
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Never update/create/create-drop in a shared environment
      # (11-Development-Rules.md §14.6). Schema changes reach production only
      # through a reviewed migration (Flyway, once introduced — §14.5).
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    # RS256 (ADR-0003, 03-Security.md §3) — asymmetric so the verification
    # key can later be distributed to other services without sharing the
    # signing secret. No default for either key: JWT_PRIVATE_KEY/
    # JWT_PUBLIC_KEY accept either a PEM block or a raw Base64 DER blob
    # (PKCS8/X509 respectively) — JwtService strips any PEM markers before
    # decoding either way.
    algorithm: RS256
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
  admin-bootstrap:
    # No default for either value - same "fail loudly at startup" rule as
    # every other production secret (SDR-015).
    email: ${ADMIN_BOOTSTRAP_EMAIL}
    password: ${ADMIN_BOOTSTRAP_PASSWORD}
  cors:
    # No default: production must declare its real origin(s) explicitly.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  openapi:
    server:
      # No default here either — the localhost fallback in application.yml
      # is a dev-only convenience and must never leak into a prod document.
      url: ${API_SERVER_URL}
      description: ${API_SERVER_DESCRIPTION:Production}

springdoc:
  # A public production Swagger UI/OpenAPI document is an information-
  # disclosure and attack-surface-mapping aid to an attacker — disabled
  # outright, not merely left unauthenticated (09-Security-Operations.md
  # §17.6). SwaggerSecurityConfig's permitted paths become moot once the
  # endpoints themselves don't exist to be reached.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.helpdesk: INFO
    # No SQL/parameter logging in production — both a noise and a
    # sensitive-data-exposure concern (09-Security-Operations.md §16.2).
    org.hibernate.SQL: WARN
