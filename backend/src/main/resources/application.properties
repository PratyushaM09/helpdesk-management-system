spring.application.name=helpdesk-management-system

# --------------------------------------------------------------------------
# TEMPORARY - Milestone 1 (Project Bootstrap) ONLY.
#
# spring-boot-starter-data-jpa and the MySQL driver are on the classpath
# (required dependencies for this milestone), but no database connection is
# configured yet - that is explicitly deferred to the milestone that
# introduces application.yml, environment-specific profiles, and the real
# datasource (see docs/02-Architecture.md #17 and docs/11-Development-Rules.md #14).
#
# Without this exclusion, Spring Boot's autoconfiguration would try to build
# a DataSource / EntityManagerFactory at startup and fail immediately with
# "Failed to configure a DataSource: 'url' attribute is not specified".
#
# Remove this line the moment real datasource configuration is added - do
# not carry it forward into later milestones.
# --------------------------------------------------------------------------
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
