<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roles · HelpDesk</title>
  <meta name="description" content="View HelpDesk roles and their permissions." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/shell.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="app-shell" id="app-shell">
    <aside class="app-shell__sidebar sidebar" id="sidebar" aria-label="Primary">
      <div class="sidebar__brand">
        <i class="bi bi-headset" aria-hidden="true"></i>
        <span class="sidebar__brand-text">HelpDesk</span>
      </div>

      <nav class="sidebar__nav" aria-label="Main navigation">
        <ul class="sidebar__list">
          <li>
            <a class="sidebar__link" href="dashboard.html" data-nav="dashboard.html">
              <i class="bi bi-speedometer2" aria-hidden="true"></i>
              <span>Dashboard</span>
            </a>
          </li>
          <li>
            <a class="sidebar__link" href="tickets.html" data-nav="tickets.html">
              <i class="bi bi-ticket-detailed" aria-hidden="true"></i>
              <span>Tickets</span>
            </a>
          </li>
          <li>
            <a class="sidebar__link" href="create-ticket.html" data-nav="create-ticket.html">
              <i class="bi bi-plus-circle" aria-hidden="true"></i>
              <span>Create Ticket</span>
            </a>
          </li>
          <li>
            <a class="sidebar__link" href="profile.html" data-nav="profile.html">
              <i class="bi bi-person-circle" aria-hidden="true"></i>
              <span>Profile</span>
            </a>
          </li>
        </ul>

        <div class="sidebar__divider" role="separator"></div>
        <p class="sidebar__section-label">Administration</p>
        <ul class="sidebar__list">
          <li>
            <a class="sidebar__link" href="users.html" data-nav="users.html">
              <i class="bi bi-people" aria-hidden="true"></i>
              <span>Users</span>
            </a>
          </li>
          <li>
            <a class="sidebar__link" href="roles.html" data-nav="roles.html">
              <i class="bi bi-shield-lock" aria-hidden="true"></i>
              <span>Roles</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar__footer">
        <button
          type="button"
          class="sidebar__link"
          data-logout-action
        >
          <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <div class="app-shell__overlay" id="shell-overlay" hidden></div>

    <header class="app-shell__topbar topbar">
      <button
        type="button"
        class="topbar__menu-toggle"
        id="sidebar-toggle"
        aria-label="Toggle navigation"
        aria-expanded="false"
        aria-controls="sidebar"
      >
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>

      <p class="topbar__title" aria-hidden="true">Roles</p>

      <div class="topbar__search">
        <i class="bi bi-search" aria-hidden="true"></i>
        <input
          type="search"
          class="topbar__search-input"
          placeholder="Search tickets…"
          aria-label="Search tickets"
        />
      </div>

      <div class="topbar__actions">
        <button
          type="button"
          class="topbar__icon-btn"
          aria-label="Notifications, 3 unread"
          data-placeholder-action="Notifications aren't wired up yet."
        >
          <i class="bi bi-bell" aria-hidden="true"></i>
          <span class="topbar__badge" aria-hidden="true">3</span>
        </button>

        <div class="topbar__user">
          <button
            type="button"
            class="topbar__user-trigger"
            id="user-menu-trigger"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="user-menu"
          >
            <span class="avatar" aria-hidden="true">JD</span>
            <span class="topbar__user-info">
              <span class="topbar__user-name">Jordan Diaz</span>
              <span class="badge badge--brand">Admin</span>
            </span>
            <i class="bi bi-chevron-down" aria-hidden="true"></i>
          </button>

          <div class="dropdown-menu" id="user-menu" role="menu" aria-label="User menu" hidden>
            <a class="dropdown-menu__item" role="menuitem" href="profile.html">
              <i class="bi bi-person" aria-hidden="true"></i>
              Profile
            </a>
            <div class="dropdown-menu__divider" role="separator"></div>
            <button
              type="button"
              class="dropdown-menu__item"
              role="menuitem"
              data-logout-action
            >
              <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
              Logout
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="app-shell__main" id="main-content">
      <div class="page-header">
        <div>
          <h1 class="page-header__title">Roles</h1>
          <p class="page-header__subtitle">
            Fixed system roles and what each one can do. Read-only — roles aren't created or deleted here.
          </p>
        </div>
      </div>

      <p class="form-hint" id="roles-loading">Loading roles…</p>

      <div class="alert alert--danger mb-6" id="roles-error-state" role="alert" hidden>
        <i class="bi bi-exclamation-octagon-fill alert__icon" aria-hidden="true"></i>
        <div>
          <p class="alert__title">Couldn't load roles</p>
          <p id="roles-error-message"></p>
        </div>
      </div>

      <div class="grid grid-cols-3" id="roles-grid" hidden></div>
    </main>
  </div>

  <script type="module" src="js/pages/roles.js"></script>
</body>
</html>
