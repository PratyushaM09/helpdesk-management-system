# Local development profile.
#
# One-time local setup required before this profile can start:
#   The database connection PASSWORD is intentionally NOT defaulted here —
#   per docs/09-Security-Operations.md §14.3, even a throwaway local dev
#   credential is never committed as a literal. Set it once as an
#   environment variable (shell profile, or your IDE's run configuration):
#
#     DB_PASSWORD=<your local helpdesk_app MySQL password>
#
#   Everything else below (host, port, schema name, username) has a sane
#   local default and does not need to be set.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:helpdesk_dev}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=false
    username: ${DB_USERNAME:helpdesk_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Permitted only in a throwaway local dev sandbox
      # (11-Development-Rules.md §14.6) — Hibernate may create/update tables
      # as entities are added in later milestones. Never used in a shared
      # or production environment (see application-prod.yml: validate).
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.helpdesk: DEBUG
    # SQL statements and bound parameter values — invaluable locally,
    # never enabled outside dev (parameter values can carry user data).
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
